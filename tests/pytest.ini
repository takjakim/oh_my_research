[pytest]
markers =
    offline: Tests that run without network, codex, R, or Quarto (fast, always run in CI)
    codex: Tests requiring the codex CLI executable
    r: Tests requiring a local R installation meeting the version floor (>=4.2.0)
    quarto: Tests requiring a local Quarto installation meeting the version floor (>=1.4.0)
addopts = -v --tb=short
testpaths = tests
