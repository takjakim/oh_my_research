interface:
  display_name: "설정 점검"
  short_description: "R/Quarto/pandoc/Python을 프로브하고 버전 하한을 적용하며 MCP 경계를 분류하고 EV5 세션 전역 게이트를 실행합니다."
  default_prompt: "제 설정을 점검하고 모든 것이 올바르게 설치되었는지 검증해 주세요."
  icon_small: "./assets/icon.svg"
  brand_color: "#ca8a04"

dependencies:
  tools:
    - type: "mcp"
      value: "omr_render"
      description: "render.version / render.classify_privilege probes (advisory wiring hint only; tools are session-global once registered)."
    - type: "mcp"
      value: "omr_scholar"
      description: "scholar.version probe for the EV5 session-global gate (advisory wiring hint only)."

policy:
  allow_implicit_invocation: true
