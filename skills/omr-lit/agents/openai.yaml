interface:
  display_name: "문헌 검색·정리"
  short_description: "학술 제공자를 검색하고 결과를 중복 제거하여 deduped library.bib와 근거 표를 구축합니다."
  default_prompt: "제 연구 질문에 대한 문헌을 찾고 정리하도록 도와주세요."
  icon_small: "./assets/icon.svg"
  brand_color: "#7c3aed"

dependencies:
  tools:
    - type: "mcp"
      value: "omr_scholar"
      description: "Scholarly search/dedup/BibTeX (advisory wiring hint only; tools are session-global once the installer registers [mcp_servers.omr_scholar])."

policy:
  allow_implicit_invocation: true
