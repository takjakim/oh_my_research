interface:
  display_name: "원고 작성"
  short_description: "이전 단계들로부터 IMRaD 원고를 조립하고 Quarto로 인용이 포함된 DOCX를 렌더링합니다."
  default_prompt: "제 연구를 IMRaD 원고로 작성하고 DOCX로 렌더링해 주세요."
  icon_small: "./assets/icon.svg"
  brand_color: "#dc2626"

dependencies:
  tools:
    - type: "mcp"
      value: "omr_render"
      description: "Quarto -> DOCX render with bibliography + CSL (advisory wiring hint only; tools are session-global once registered)."
    - type: "mcp"
      value: "omr_scholar"
      description: "Citation/bibliography support (advisory wiring hint only; library.bib is read directly)."

policy:
  allow_implicit_invocation: true
